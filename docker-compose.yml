services:
  oaksome-web:
    build:
      context: .
      args:
        NEXT_PUBLIC_ODOO_URL: ${NEXT_PUBLIC_ODOO_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID}
        NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID}
        NEXT_PUBLIC_GA4_MEASUREMENT_ID: ${NEXT_PUBLIC_GA4_MEASUREMENT_ID}
        NEXT_PUBLIC_PINTEREST_TAG_ID: ${NEXT_PUBLIC_PINTEREST_TAG_ID}
    image: oaksome-web:latest
    ports:
      - '3000:3000'
    env_file:
      - .env.local
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/',r=>r.statusCode<500?process.exit(0):process.exit(1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
